<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>语义配置合并器</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f5f7; color: #222; }
  header { background: #1f2937; color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header button { margin-left: auto; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button.secondary { background: #6b7280; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  #setup { padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
  #setup textarea { width: 32%; height: 110px; font-family: ui-monospace, monospace; font-size: 12px; margin-right: 1%; vertical-align: top; }
  #setup .bar { margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  #status { padding: 6px 16px; font-size: 13px; background: #eef2ff; border-bottom: 1px solid #e5e7eb; }
  #status .err { color: #b91c1c; }
  main { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; padding: 8px 16px; height: calc(100vh - 230px); min-height: 320px; }
  .pane { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: auto; padding: 10px; }
  .pane h2 { font-size: 14px; margin: 0 0 8px; color: #374151; }
  .node { padding: 2px 4px; border-radius: 4px; cursor: pointer; font-family: ui-monospace, monospace; font-size: 12.5px; white-space: nowrap; }
  .node:hover { background: #eff6ff; }
  .node.selected { background: #dbeafe; }
  .badge { display: inline-block; font-size: 10px; border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  .b-conflict { background: #fee2e2; color: #b91c1c; }
  .b-auto { background: #dcfce7; color: #15803d; }
  .b-clean { background: #f3f4f6; color: #6b7280; }
  pre { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; font-size: 12px; overflow: auto; margin: 6px 0; }
  .kv { font-size: 13px; margin: 4px 0; }
  .kv b { color: #374151; }
  .origin { display: inline-block; background: #ede9fe; color: #5b21b6; border-radius: 4px; padding: 1px 6px; font-size: 11px; margin: 1px 2px; }
  .choices button { margin-right: 6px; margin-bottom: 6px; }
  .suggestion { background: #fef9c3; border: 1px solid #fde047; border-radius: 6px; padding: 6px; font-size: 12px; margin: 6px 0; }
  #preview { white-space: pre; font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>语义配置合并器</h1>
  <span id="sessInfo" style="font-size:12px;color:#9ca3af"></span>
  <button onclick="loadSample()">加载示例</button>
  <button class="secondary" onclick="createSession()">创建合并会话</button>
</header>
<div id="setup">
  <textarea id="base" placeholder="共同祖先 (base)"></textarea>
  <textarea id="ours" placeholder="分支一 (ours)"></textarea>
  <textarea id="theirs" placeholder="分支二 (theirs)"></textarea>
  <div class="bar">
    <label style="font-size:13px">格式
      <select id="format"><option>YAML</option><option>JSON</option></select>
    </label>
    <label style="font-size:13px">数组策略（每行：路径 策略[idKey]，策略=REPLACE/BY_ID/SEQUENCE）
      <input id="policies" size="46" value="/features BY_ID id">
    </label>
  </div>
</div>
<div id="status">尚未创建会话。</div>
<main>
  <div class="pane"><h2>结构视图</h2><div id="tree">—</div></div>
  <div class="pane"><h2>节点详情 / 冲突裁决</h2><div id="detail">选择左侧节点查看来源与冲突原因。</div></div>
  <div class="pane"><h2>导出预览</h2>
    <div style="margin-bottom:6px">
      <select id="expFmt"><option value="yaml">YAML</option><option value="json">JSON</option></select>
      <button class="secondary" onclick="refreshExport()">刷新预览</button>
    </div>
    <div id="preview">—</div>
  </div>
</main>
<script>
let session = null;
let selectedPath = '/';

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function loadSample(){
  fetch('/api/sample').then(r=>r.json()).then(j=>{
    document.getElementById('base').value = j.base;
    document.getElementById('ours').value = j.ours;
    document.getElementById('theirs').value = j.theirs;
    document.getElementById('format').value = j.format;
    document.getElementById('policies').value =
      j.policies.arrays.map(a=>`${a.path} ${a.strategy} ${a.idKey||''}`.trim()).join('\n');
  });
}

function parsePolicies(){
  const lines = document.getElementById('policies').value.split('\n').map(s=>s.trim()).filter(Boolean);
  return lines.map(l=>{
    const [path, strategy, idKey] = l.split(/\s+/);
    return { path, strategy, idKey: idKey || 'id' };
  });
}

function createSession(){
  const body = {
    name: '手工会话', format: document.getElementById('format').value,
    base: document.getElementById('base').value,
    ours: document.getElementById('ours').value,
    theirs: document.getElementById('theirs').value,
    policies: { version: 'v1', arrays: parsePolicies() }
  };
  fetch('/api/sessions', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
    .then(r=>r.json()).then(j=>{
      if(j.error){ setStatus('创建失败：'+j.message, true); return; }
      session = j; renderAll();
    });
}

function setStatus(msg, isErr){
  document.getElementById('status').innerHTML = isErr ? `<span class="err">${esc(msg)}</span>` : esc(msg);
}

function renderAll(){
  document.getElementById('sessInfo').textContent =
    `会话 ${session.id} · 版本 ${session.version} · 策略 ${session.policyVersion}`;
  setStatus(`已自动合并 ${session.autoCount} 项，待解决冲突 ${session.conflictCount} 项。`);
  fetch(`/api/sessions/${session.id}/tree`).then(r=>r.json()).then(t=>{
    document.getElementById('tree').innerHTML = renderNode(t, '（根）', 0);
    bindTree();
  });
  refreshExport();
}

function renderNode(n, label, depth){
  const badge = n.status==='conflict' ? '<span class="badge b-conflict">冲突</span>'
    : n.status==='auto' ? '<span class="badge b-auto">自动</span>'
    : '<span class="badge b-clean">一致</span>';
  const val = n.type==='scalar' ? ` = ${esc(n.value)}` : n.type==='null' ? ' = null' : '';
  let html = `<div class="node" data-path="${esc(n.path)}" style="padding-left:${depth*14+4}px">${esc(label)}${val}${badge}</div>`;
  if(n.type==='object'){
    for(const k of Object.keys(n.children)) html += renderNode(n.children[k], k, depth+1);
  } else if(n.type==='array'){
    n.children.forEach((c,i)=>{ html += renderNode(c, `[${i}]`, depth+1); });
  }
  return html;
}

function bindTree(){
  document.querySelectorAll('.node').forEach(el=>{
    el.onclick = ()=>{
      document.querySelectorAll('.node').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      selectedPath = el.dataset.path;
      showDetail(selectedPath);
    };
  });
}

function originsHtml(os){
  if(!os || !os.length) return '<span class="origin">无记录</span>';
  return os.map(o=>`<span class="origin">${esc(o.source)}${o.note?(' · '+esc(o.note)):''}</span>`).join(' → ');
}

function showDetail(path){
  fetch(`/api/sessions/${session.id}/node?path=${encodeURIComponent(path)}`)
    .then(r=>r.json()).then(j=>{
      let html = `<div class="kv"><b>路径：</b>${esc(j.path)}</div>
        <div class="kv"><b>指纹：</b><code>${esc(j.fingerprint.slice(0,16))}…</code></div>
        <div class="kv"><b>来源链：</b>${originsHtml(j.origins)}</div>
        <div class="kv"><b>合并结果：</b></div><pre>${esc(j.value)}</pre>`;
      if(j.conflict){
        const c = j.conflict;
        html += `<div class="kv"><b>冲突原因：</b><span class="badge b-conflict">${esc(c.reason)}</span> ${esc(c.detail)}</div>
          <div class="kv"><b>base：</b></div><pre>${esc(c.base)}</pre>
          <div class="kv"><b>ours：</b></div><pre>${esc(c.ours)}</pre>
          <div class="kv"><b>theirs：</b></div><pre>${esc(c.theirs)}</pre>`;
        if(c.suggestion) html += `<div class="suggestion">💡 ${esc(c.suggestion)}</div>`;
        html += `<div class="choices">
          <button onclick="resolve('${esc(c.path)}','ours')">采用 ours</button>
          <button onclick="resolve('${esc(c.path)}','theirs')">采用 theirs</button>
          <button onclick="resolve('${esc(c.path)}','base')">保留 base</button>
          <button onclick="resolve('${esc(c.path)}','delete')">删除该项</button>
        </div>`;
      }
      document.getElementById('detail').innerHTML = html;
    });
}

function resolve(path, choice){
  const body = { expectedVersion: session.version, resolutions: [{ path, choice }] };
  fetch(`/api/sessions/${session.id}/resolve`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
    .then(r=>r.json().then(j=>({code:r.status, j})))
    .then(({code,j})=>{
      if(code===409){ setStatus('提交被拒绝：'+j.message, true); return; }
      if(j.error){ setStatus(j.message, true); return; }
      session = j; renderAll();
      setStatus(`裁决已保存（可重放）。剩余冲突 ${session.conflictCount} 项。`);
    });
}

function refreshExport(){
  if(!session) return;
  const fmt = document.getElementById('expFmt').value;
  fetch(`/api/sessions/${session.id}/export?fmt=${fmt}`).then(r=>r.json()).then(j=>{
    document.getElementById('preview').textContent = j.text || '（空）';
  });
}
</script>
</body>
</html>
